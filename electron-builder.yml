appId: com.claritas.app
productName: Claritas
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

files:
  - out/**/*

asarUnpack:
  - resources/**

extraResources:
  - from: resources/inkscape
    to: inkscape
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claritas

npmRebuild: false
publish:
  provider: github
  owner: LucasLima38
  repo: Claritas
